[project]
name = "researchassistantai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "rdkit>=2026.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    'ignore::DeprecationWarning:google\.genai\.types',
]
